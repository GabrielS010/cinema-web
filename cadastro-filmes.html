<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Filme - CineBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <header id="header-nav"></header>

  <main class="container py-5" style="max-width: 800px;">
    <section class="card card-custom p-4 p-md-5">
      <h2 class="fw-bold mb-4 pb-2 border-bottom border-secondary">
        <i class="bi bi-plus-square me-2 text-primary"></i>Cadastrar Filme
      </h2>
      
      <form id="form-filme">
        <div class="row mb-4">
          <div class="col-md-7">
            <label for="titulo" class="form-label fw-semibold">Título do Filme</label>
            <input type="text" id="titulo" class="form-control" required>
          </div>
          <div class="col-md-5 mt-3 mt-md-0">
            <label for="genero" class="form-label fw-semibold">Gênero</label>
            <select id="genero" class="form-select" required>
              <option value="">Selecione o gênero...</option>
              <option value="Ação">Ação</option>
              <option value="Animação">Animação</option>
              <option value="Aventura">Aventura</option>
              <option value="Comédia">Comédia</option>
              <option value="Documentário">Documentário</option>
              <option value="Drama">Drama</option>
              <option value="Fantasia">Fantasia</option>
              <option value="Ficção Científica">Ficção Científica</option>
              <option value="Musical">Musical</option>
              <option value="Romance">Romance</option>
              <option value="Suspense">Suspense</option>
              <option value="Terror">Terror</option>
            </select>
          </div>
        </div>

        <fieldset class="mb-4">
          <legend class="fs-6 fw-semibold">Classificação Indicativa</legend>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="classificacao" id="clasLivre" value="Livre" checked>
            <label class="btn btn-outline-success fw-bold" for="clasLivre">Livre</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas10" value="10 anos">
            <label class="btn btn-outline-info fw-bold" for="clas10">10</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas12" value="12 anos">
            <label class="btn btn-outline-warning fw-bold" for="clas12">12</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas14" value="14 anos">
            <label class="btn btn-outline-orange fw-bold" for="clas14">14</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas16" value="16 anos">
            <label class="btn btn-outline-danger fw-bold" for="clas16">16</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas18" value="18 anos">
            <label class="btn btn-outline-light fw-bold" for="clas18">18</label>
          </div>
        </fieldset>

        <div class="mb-4">
          <label for="descricao" class="form-label fw-semibold">Sinopse</label>
          <textarea id="descricao" class="form-control" rows="3" required></textarea>
        </div>
        
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="duracao" class="form-label fw-semibold">Duração (min)</label>
            <input type="number" id="duracao" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="dataEstreia" class="form-label fw-semibold">Data de Estreia</label>
            <input type="date" id="dataEstreia" class="form-control" required>
          </div>
        </div>

        <div class="mb-5">
          <label for="imagem" class="form-label fw-semibold">URL do Cartaz</label>
          <div class="input-group">
            <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-link-45deg"></i></span>
            <input type="url" id="imagem" class="form-control" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 rounded-1">
          <i class="bi bi-floppy me-2"></i>Salvar Filme
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/pages/cadastro-filmes.js"></script>
</body>
</html>
