<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieSTAR - Cadastrar Filme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header id="header-nav"></header>
  <main class="container my-5" style="max-width: 700px;">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-header bg-warning text-dark text-center fw-bold fs-4 rounded-top-4">
        🎬 Cadastrar Novo Filme
      </div>
      <form id="form-filme" class="card-body p-4 p-md-5">
        <div class="mb-3">
          <label class="form-label fw-bold">Título do Filme</label>
          <input type="text" id="titulo" class="form-control form-control-lg" placeholder="Ex: Vingadores" required>
        </div>
        
        <div class="mb-4">
          <label class="form-label fw-bold d-block">Gênero</label>
          <div class="btn-group flex-wrap w-100" role="group">
            <input type="radio" class="btn-check" name="genero" id="genAcao" value="Ação" checked>
            <label class="btn btn-outline-primary" for="genAcao">Ação</label>
            <input type="radio" class="btn-check" name="genero" id="genComedia" value="Comédia">
            <label class="btn btn-outline-primary" for="genComedia">Comédia</label>
            <input type="radio" class="btn-check" name="genero" id="genDrama" value="Drama">
            <label class="btn btn-outline-primary" for="genDrama">Drama</label>
            <input type="radio" class="btn-check" name="genero" id="genTerror" value="Terror">
            <label class="btn btn-outline-primary" for="genTerror">Terror</label>
            <input type="radio" class="btn-check" name="genero" id="genFiccao" value="Ficção">
            <label class="btn btn-outline-primary" for="genFiccao">Ficção</label>
          </div>
        </div>

<div class="mb-4">
          <label class="form-label fw-bold d-block">Classificação Indicativa</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="classificacao" id="clasLivre" value="Livre" checked>
            <label class="btn btn-outline-success" for="clasLivre">Livre</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas10" value="10 anos">
            <label class="btn btn-outline-info" for="clas10">10</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas12" value="12 anos">
            <label class="btn btn-outline-warning" for="clas12">12</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas14" value="14 anos">
            <label class="btn btn-outline-primary" for="clas14">14</label>
            
            <input type="radio" class="btn-check" name="classificacao" id="clas16" value="16 anos">
            <label class="btn btn-outline-danger" for="clas16">16</label>
            
            <!-- Correção do 18 anos aqui em baixo! -->
            <input type="radio" class="btn-check" name="classificacao" id="clas18" value="18 anos">
            <label class="btn btn-outline-secondary fw-bold" for="clas18">18</label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Descrição</label>
          <textarea id="descricao" class="form-control" rows="3" placeholder="Sinopse..." required></textarea>
        </div>
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Duração (min)</label>
            <input type="number" id="duracao" class="form-control" placeholder="120" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Data de Estreia</label>
            <input type="date" id="dataEstreia" class="form-control" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">URL do Cartaz</label>
          <input type="url" id="imagem" class="form-control" placeholder="https://link-da-imagem.jpg" required>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 fs-5 text-dark rounded-pill shadow">Salvar Filme</button>
      </form>
    </div>
  </main>
  <script type="module" src="./js/pages/cadastro-filmes.js"></script>
</body>
</html>
