<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Sessão - CineBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <header id="header-nav"></header>

  <main class="container py-5" style="max-width: 650px;">
    <section class="card card-custom p-4 p-md-5">
      <h2 class="fw-bold mb-4 pb-2 border-bottom border-secondary">
        <i class="bi bi-clock-history me-2 text-primary"></i>Criar Nova Sessão
      </h2>
      <form id="form-sessao">
        <div class="mb-4">
          <label for="select-filme" class="form-label fw-semibold">Filme</label>
          <select id="select-filme" class="form-select" required>
            <option value="">Selecione o filme...</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="select-sala" class="form-label fw-semibold">Sala</label>
          <select id="select-sala" class="form-select" required>
            <option value="">Selecione a sala...</option>
          </select>
        </div>
        
        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold d-block">Idioma</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="idioma" id="idDublado" value="Dublado" checked>
              <label class="btn btn-outline-secondary" for="idDublado">Dublado</label>
              <input type="radio" class="btn-check" name="idioma" id="idLegendado" value="Legendado">
              <label class="btn btn-outline-secondary" for="idLegendado">Legendado</label>
            </div>
          </div>
          <div class="col-md-6 mt-3 mt-md-0">
            <label class="form-label fw-semibold d-block">Formato</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="formato" id="form2D" value="2D" checked>
              <label class="btn btn-outline-secondary" for="form2D">2D</label>
              <input type="radio" class="btn-check" name="formato" id="form3D" value="3D">
              <label class="btn btn-outline-secondary" for="form3D">3D</label>
            </div>
          </div>
        </div>

        <div class="row mb-5">
          <div class="col-md-6">
            <label for="dataHora" class="form-label fw-semibold">Data e Hora</label>
            <input type="datetime-local" id="dataHora" class="form-control" required>
          </div>
          <div class="col-md-6 mt-3 mt-md-0">
            <label for="preco" class="form-label fw-semibold">Preço (R$)</label>
            <input type="number" id="preco" step="0.01" class="form-control" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 rounded-1">
          <i class="bi bi-floppy me-2"></i>Salvar Sessão
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/pages/cadastro-sessoes.js"></script>
</body>
</html>
