<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBox - Gestão de Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <!-- Container vazio onde a Navbar será injetada dinamicamente via JavaScript -->
  <header id="header-nav"></header>

  <!-- Conteúdo principal da Dashboard com padding vertical (py-5) -->
  <main class="container py-5">
    
    <!-- Hero Section: Bloco de destaque inicial com apresentação do sistema -->
    <section class="hero-section mb-5 shadow-lg">
      <h1 class="display-4 fw-bold mb-3">O cinema levado a <span class="text-primary">sério.</span></h1>
      <p class="fs-5 text-secondary mb-4">Plataforma de gestão de bilheteria e catálogo de filmes.</p>
      
      <!-- Botão de Ação Direta (CTA) direcionando para a listagem de sessões -->
      <a href="sessoes.html" class="btn btn-primary btn-lg fw-bold px-5 rounded-1 text-nowrap">
        <i class="bi bi-play-circle me-2"></i>Sessões de Hoje
      </a>
    </section>

    <!-- Grid responsivo do Bootstrap (row com g-4 para espaçamento interno) para os cards de navegação -->
    <section class="row g-4 text-center">
      
      <!-- Card Filmes: Ocupa 12 colunas em telas pequenas, 6 em médias e 3 em telas grandes (col-12 col-sm-6 col-lg-3) -->
      <article class="col-12 col-sm-6 col-lg-3">
        <a href="cadastro-filmes.html" class="card card-custom h-100 text-decoration-none">
          <div class="card-body d-flex flex-column justify-content-center p-4">
            <i class="bi bi-film fs-1 mb-2 text-primary"></i>
            <span class="fw-bold fs-5 text-light">Filmes</span>
          </div>
        </a>
      </article>

      <!-- Card Salas: Direciona para o cadastro de salas físicas -->
      <article class="col-12 col-sm-6 col-lg-3">
        <a href="cadastro-salas.html" class="card card-custom h-100 text-decoration-none">
          <div class="card-body d-flex flex-column justify-content-center p-4">
            <i class="bi bi-door-open fs-1 mb-2 text-primary"></i>
            <span class="fw-bold fs-5 text-light">Salas</span>
          </div>
        </a>
      </article>

      <!-- Card Sessões: Direciona para o cadastro e associação de filmes a salas e horários -->
      <article class="col-12 col-sm-6 col-lg-3">
        <a href="cadastro-sessoes.html" class="card card-custom h-100 text-decoration-none">
          <div class="card-body d-flex flex-column justify-content-center p-4">
            <i class="bi bi-clock-history fs-1 mb-2 text-primary"></i>
            <span class="fw-bold fs-5 text-light">Sessões</span>
          </div>
        </a>
      </article>

      <!-- Card Bilheteria: Destaque visual em verde para a área comercial/vendas -->
      <article class="col-12 col-sm-6 col-lg-3">
        <a href="venda-ingressos.html" class="card card-custom h-100 text-decoration-none" style="border-color: #198754;">
          <div class="card-body d-flex flex-column justify-content-center p-4">
            <i class="bi bi-cart-check fs-1 mb-2 text-success"></i>
            <span class="fw-bold fs-5 text-success">Bilheteria</span>
          </div>
        </a>
      </article>
    </section>
  </main>

  <!-- Script de entrada usando ES Modules (type="module") para renderizar o componente dinâmico de Navbar -->
  <script type="module">
    import { carregarNavbar } from './js/components/navbar.js';
    carregarNavbar();
  </script>
</body>
</html>
