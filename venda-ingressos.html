<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilheteria - CineBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <header id="header-nav"></header>

  <main class="container py-5" style="max-width: 650px;">
    <section class="card card-custom p-4 p-md-5">
      <h2 class="fw-bold mb-4 pb-2 border-bottom border-secondary">
        <i class="bi bi-ticket-detailed me-2 text-primary"></i>Vender Ingresso
      </h2>
      <form id="form-ingresso">
        <div class="mb-4">
          <label for="select-sessao" class="form-label fw-semibold">Sessão</label>
          <select id="select-sessao" class="form-select" required>
            <option value="">Selecione a sessão...</option>
          </select>
        </div>
        
        <div class="row mb-4">
          <div class="col-md-6">
            <label for="nomeCliente" class="form-label fw-semibold">Nome do Cliente</label>
            <input type="text" id="nomeCliente" class="form-control" required>
          </div>
          <div class="col-md-6 mt-3 mt-md-0">
            <label for="cpf" class="form-label fw-semibold">CPF</label>
            <input type="text" id="cpf" class="form-control" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold d-block mb-2">Selecione o Assento</label>
          <div class="screen-indicator mb-3">TELA</div>
          <div id="mapa-assentos" class="seat-grid mb-3"></div>
          <input type="hidden" id="assento" required>
          <div class="text-center text-secondary small">
            Selecionado: <span id="assento-escolhido" class="text-light fw-bold">Nenhum</span>
          </div>
        </div>

        <div class="mb-5">
          <label for="tipoPagamento" class="form-label fw-semibold">Pagamento</label>
          <select id="tipoPagamento" class="form-select" required>
            <option value="Cartão">Cartão</option>
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold py-3 rounded-1">
          <i class="bi bi-cart-check me-2"></i>Confirmar Venda
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/pages/venda-ingressos.js"></script>
</body>
</html>
