<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venda de Ingressos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header id="header-nav"></header>
  <main class="container" style="max-width: 600px;">
    <h2>Vender Ingresso</h2>
    <form id="form-ingresso" class="card p-4">
      <select id="select-sessao" class="form-select mb-3" required><option value="">Sessão...</option></select>
      <input type="text" id="nomeCliente" class="form-control mb-3" placeholder="Nome do Cliente" required>
      <input type="text" id="cpf" class="form-control mb-3" placeholder="CPF" required>
      <input type="text" id="assento" class="form-control mb-3" placeholder="Assento (Ex: A1)" required>
      <select id="tipoPagamento" class="form-select mb-3">
        <option value="Cartão">Cartão</option>
        <option value="Pix">Pix</option>
      </select>
      <button type="submit" class="btn btn-success">Confirmar Venda</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/pages/venda-ingressos.js"></script>
</body>
</html>
