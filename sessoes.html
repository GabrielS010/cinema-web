<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessões - CineBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <!-- Container de injeção da Navbar modular -->
  <header id="header-nav"></header>

  <!-- Área principal de exibição do catálogo de horários -->
  <main class="container py-5">
    <!-- Título da página com separador em borda inferior -->

      <i class="bi bi-film me-2 text-primary"></i>Sessões Disponíveis

    <!-- Container Alvo: Esta div com id="container-sessoes" será populada via DOM Manipulation pelo JS -->
    <div id="container-sessoes" class="row g-4"></div>

  <!-- Importação do script de regra de negócio específico da página de sessões -->
  <script type="module" src="./js/pages/sessoes.js"></script>
