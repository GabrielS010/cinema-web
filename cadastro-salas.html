<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header id="header-nav"></header>
  <main class="container" style="max-width: 600px;">
    <h2>Cadastrar Sala</h2>
    <form id="form-sala" class="card p-4">
      <input type="text" id="nome" class="form-control mb-3" placeholder="Nome da Sala" required>
      <input type="number" id="capacidade" class="form-control mb-3" placeholder="Capacidade" required>
      <select id="tipo" class="form-select mb-3" required>
        <option value="2D">2D</option>
        <option value="3D">3D</option>
      </select>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/pages/cadastro-salas.js"></script>
</body>
</html>
