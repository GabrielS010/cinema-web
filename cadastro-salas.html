<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Sala - CineBox</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">
  <header id="header-nav"></header>

  <main class="container py-5" style="max-width: 600px;">
    <section class="card card-custom p-4 p-md-5">
      <h2 class="fw-bold mb-4 pb-2 border-bottom border-secondary">
        <i class="bi bi-door-open me-2 text-primary"></i>Cadastrar Sala
      </h2>
      <form id="form-sala">
        <div class="mb-4">
          <label for="nome" class="form-label fw-semibold">Nome da Sala</label>
          <input type="text" id="nome" class="form-control" required>
        </div>
        <div class="mb-4">
          <label for="capacidade" class="form-label fw-semibold">Capacidade (Lugares)</label>
          <input type="number" id="capacidade" class="form-control" required min="1">
        </div>
        <div class="mb-5">
          <label for="tipo" class="form-label fw-semibold">Tipo de Exibição</label>
          <select id="tipo" class="form-select" required>
            <option value="2D">2D</option>
            <option value="3D">3D</option>
            <option value="IMAX">IMAX</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 rounded-1">
          <i class="bi bi-floppy me-2"></i>Salvar Sala
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/pages/cadastro-salas.js"></script>
</body>
</html>
